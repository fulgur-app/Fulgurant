{% if error_message != "" %}
    <div class="alert alert-error mb-4" role="alert">{{ error_message }}</div>
{% endif %}

<form hx-post="/settings/update-email"
      hx-target="#email-update-container"
      hx-swap="innerHTML">
    <label class="label" for="new-email">Email</label>
    <input type="email"
           id="new-email"
           name="email"
           value="{{ email }}"
           required
           autocomplete="email"
           class="input input-bordered w-full">
    <label class="label mt-4" for="email-change-current-password">Current Password</label>
    <input type="password"
           id="email-change-current-password"
           name="current_password"
           required
           autocomplete="current-password"
           class="input input-bordered w-full">
    <div class="flex justify-end w-full">
        <button type="submit" class="btn btn-primary mt-4">Update Email</button>
    </div>
</form>
