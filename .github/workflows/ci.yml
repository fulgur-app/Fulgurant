name: CI

# Trigger scopes:
# - push to dev-*: fmt, clippy and test run in parallel (commit smoke).
# - pull_request to main: test only (merge gate).
# - push to main (post-merge): coverage + cache warm-up, no fmt/clippy/test.
#
# Cache strategy: GitHub Actions caches are immutable per key and scoped to the
# branch that saved them. Only caches saved on main are readable by every PR and
# dev-* branch, so every job uses its own `shared-key` (clippy, test and coverage
# artefacts are not interchangeable) and only saves on main. The
# `warm-test-cache` and `warm-clippy-cache` jobs on push-to-main are what keep
# the dev-* and PR jobs warm.

on:
  push:
    branches: [main, dev-*]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Main is excluded from cancellation so
# post-merge jobs (coverage, cache warm-up) cannot be interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  BRANCH: ${{ github.ref_name }}
  COMMIT_SHA: ${{ github.sha }}
  ACTOR: ${{ github.actor }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  fmt:
    name: Formatting
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: &linux_deps_install_cmd |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev-'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The Rust tests do not need the built assets (served at runtime via
      # ServeDir); this only checks that the CSS and JS bundles still build.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS
        run: npm run tw:build

      - name: Build JS bundle
        run: npm run js:build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: *linux_deps_install_cmd

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --all-features

  warm-test-cache:
    name: Warm test cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: *linux_deps_install_cmd

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-test

      - name: Build test artefacts
        run: cargo test --all-features --no-run

  warm-clippy-cache:
    name: Warm clippy cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: *linux_deps_install_cmd

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-clippy

      - name: Build check artefacts
        run: cargo check --all-targets --all-features

  coverage:
    name: Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      percentage: ${{ steps.cov_summary.outputs.percentage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux dependencies
        run: *linux_deps_install_cmd

      # Dedicated cache: coverage builds are instrumented and cannot reuse a standard cache.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-coverage-cargo

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage summary
        id: cov_summary
        run: |
          COVERAGE=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{if(lf>0) printf "%.2f", (lh/lf)*100; else print "0.00"}' lcov.info)
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

  # Aggregator job named "CI" so branch protection can require a single stable
  # status check instead of every individual job. Fails if any gate job failed;
  # allows "skipped" so a PR (which skips fmt and clippy) still reports green.
  ci:
    name: CI
    needs: [fmt, clippy, test]
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev-'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check gate results
        env:
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
        run: |
          failed=0
          for entry in "fmt:$FMT" "clippy:$CLIPPY" "test:$TEST"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Gate failed: $name = $result"
              failed=1
            fi
          done
          exit $failed

  # Single aggregated Telegram notification for the whole workflow run.
  notify:
    name: Telegram notification
    needs: [fmt, clippy, test, warm-test-cache, warm-clippy-cache, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compose and send notification
        env:
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          WARM_TEST_CACHE: ${{ needs.warm-test-cache.result }}
          WARM_CLIPPY_CACHE: ${{ needs.warm-clippy-cache.result }}
          COVERAGE: ${{ needs.coverage.result }}
          COVERAGE_PCT: ${{ needs.coverage.outputs.percentage }}
        run: |
          # Determine overall status: failure > cancelled > success.
          STATUS="success"
          for result in "$FMT" "$CLIPPY" "$TEST" "$WARM_TEST_CACHE" "$WARM_CLIPPY_CACHE" "$COVERAGE"; do
            if [ "$result" = "failure" ]; then
              STATUS="failure"
            elif [ "$result" = "cancelled" ] && [ "$STATUS" != "failure" ]; then
              STATUS="cancelled"
            fi
          done

          # Stay silent on concurrency-cancelled runs; the superseding run will notify.
          if [ "$STATUS" = "cancelled" ]; then
            echo "Run cancelled, skipping notification"
            exit 0
          fi

          # Per-job summary line, omitting jobs that did not run.
          SUMMARY=""
          for entry in "fmt:$FMT" "clippy:$CLIPPY" "test:$TEST" "warm-test-cache:$WARM_TEST_CACHE" "warm-clippy-cache:$WARM_CLIPPY_CACHE" "coverage:$COVERAGE"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            case "$result" in
              success) SUMMARY="${SUMMARY}${name} ✅ · " ;;
              failure) SUMMARY="${SUMMARY}${name} ❌ · " ;;
            esac
          done
          SUMMARY="${SUMMARY% · }"

          if [ -z "$SUMMARY" ]; then
            echo "No jobs ran, skipping notification"
            exit 0
          fi

          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="Fulgurant CI - Build Passed"
          else
            ICON="❌"
            TITLE="Fulgurant CI - Build Failed"
          fi

          # Main-only extra: coverage percentage.
          EXTRAS=""
          if [ -n "$COVERAGE_PCT" ]; then
            EXTRAS="${EXTRAS}
          Coverage: *${COVERAGE_PCT}%*"
          fi
          COMMIT_MSG=$(git log --format=%s -1 | tr '`' "'" | head -c 80)

          MESSAGE="${ICON} *${TITLE}*

          ${SUMMARY}${EXTRAS}

          *Branch:* \`${BRANCH}\`
          *Commit:* \`${COMMIT_SHA:0:7}\` - ${COMMIT_MSG}
          *Author:* ${ACTOR}

          [View Run](${RUN_URL})"

          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}' |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d @-
